{% extends 'base.html' %}
{% block content %}
<h1>Autores</h1>
<a href="/autores/novo/" class="btn btn-primary mb-3">Novo Autor</a>
<table class="table">
    <thead><tr><th>Nome</th><th>Ações</th></tr></thead>
    <tbody>
        {% for autor in autores %}
        <tr>
            <td>{{ autor.nome }}</td>
            <td>
                <a href="/autores/{{ autor.pk }}/editar/" class="btn btn-sm btn-warning">Editar</a>
                <a href="/autores/{{ autor.pk }}/excluir/" class="btn btn-sm btn-danger">Excluir</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="2">Nenhum autor cadastrado.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
